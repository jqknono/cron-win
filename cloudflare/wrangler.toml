name = "cronwin-worker"
main = "worker.js"
compatibility_date = "2023-12-01"
compatibility_flags = ["nodejs_compat"]

# 本地开发时服务静态资源
assets = { directory = "../build", binding = "ASSETS" }

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "cronwin-stats"
database_id = "f410db86-56a3-42db-8685-f3fcab051e19"

# 日志配置（如需定时触发可在此处开启）
[triggers]
crons = []

# 管理页密钥（用于访问 /admin/stats）
# 建议使用 `wrangler secret put ADMIN_SECRET` 设置，不要写入或提交到仓库
