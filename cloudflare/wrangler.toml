name = "cronwin-worker"
main = "worker.js"
compatibility_date = "2023-12-01"
compatibility_flags = ["nodejs_compat"]

# 本地开发时服务静态资源
assets = { directory = "../build", binding = "ASSETS" }

# 自定义域名（避免 wrangler deploy 冲掉 Dashboard 里已有路由）
routes = [
  { pattern = "cronwin.techfetch.dev", custom_domain = true },
  { pattern = "wincron.techfetch.dev", custom_domain = true },
  { pattern = "taskscheduler.techfetch.dev", custom_domain = true }
]

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "cronwin-stats"
database_id = "dde72aae-b300-4ef8-b376-4e8b350d0142"

# 日志配置（如需定时触发可在此处开启）
[triggers]
crons = []

# 管理页密钥（用于访问 /admin/stats）
# 建议使用 `wrangler secret put ADMIN_SECRET` 设置，不要写入或提交到仓库
